<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <meta name="description" content="$description">
  <meta name="theme-color" content="#080d19">
  <meta property="og:type" content="website">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  $social
  <link rel="icon" href="${base}assets/images/gp.svg" type="image/svg+xml">
  <link rel="preload" href="${base}assets/fonts/spacegrotesk.woff2" as="font" type="font/woff2" crossorigin>
  <script src="${base}assets/js/theme.js"></script>
  <link rel="stylesheet" href="${base}assets/css/portfolio.css">
  <script src="${base}assets/js/portfolio.js" defer></script>
</head>
<body>
$symbols
<a class="skip" href="#main">Skip to content</a>
<header class="site-header"><div class="shell header-inner">
  <a class="brand" href="${home}#home" aria-label="ganesh.dev home"><img src="${base}assets/images/gp.svg" width="36" height="36" alt=""><span>ganesh<span class="brand-suffix">.dev</span></span></a>
  <nav id="navigation" aria-label="Main navigation">$navigation</nav>
  <div class="header-tools"><button class="theme icon-button" type="button" aria-label="Switch to light theme" title="Switch theme">$sun $moon</button><a class="talk" href="${home}#contact">$mail Let's talk</a><button class="menu icon-button" type="button" aria-expanded="false" aria-controls="navigation" aria-label="Open menu">$menu $close</button></div>
</div></header>
<main id="main">$content</main>
<footer><div class="shell foot"><span>© <span data-year>2026</span> Ganesh Pawase</span><div><a href="https://github.com/ganeshpawase95">GitHub</a><a href="https://www.linkedin.com/in/ganeshpawase/">LinkedIn</a><a href="mailto:itsganeshpawase@gmail.com">Email</a></div></div></footer>
</body></html>
